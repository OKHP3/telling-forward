kind = "mobile"
previewPath = "/mobile/"
title = "Telling Forward Mobile"
description = "Voice-first mobile companion for Telling Forward. Contributors can discover storyworlds, read story paths aloud via device TTS, and narrate new contributions via microphone — all without touching a keyboard. Connects to the shared Telling Forward API server."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
