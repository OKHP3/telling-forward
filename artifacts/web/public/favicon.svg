<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#111827"/>
  <!-- Subtle teal inner glow -->
  <rect x="1" y="1" width="510" height="510" rx="95" fill="none" stroke="#1c3a34" stroke-width="2" opacity="0.6"/>

  <!-- "TF" monogram — amber, editorial weight -->
  <!-- T crossbar -->
  <rect x="96" y="148" width="200" height="32" rx="6" fill="#e6a03c"/>
  <!-- T stem -->
  <rect x="176" y="148" width="40" height="164" rx="6" fill="#e6a03c"/>

  <!-- Forward chevron — orange accent, right half -->
  <!-- > shape: two angled strokes meeting at a point -->
  <path d="M 310 180 L 396 256 L 310 332" stroke="#c46a2c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Baseline rule — amber -->
  <rect x="96" y="344" width="320" height="6" rx="3" fill="#e6a03c" opacity="0.3"/>

  <!-- Small folio dot -->
  <circle cx="256" cy="400" r="6" fill="#e6a03c" opacity="0.25"/>
</svg>
