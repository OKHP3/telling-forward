schema: telling-forward.provenance-fidelity-cases.v1
status: owner-review-fixtures-only
enforcement_approved: false
public_reader_features_approved: false
cases:
  - id: immutable-manuscript-source
    kind: source
    artifact_kind: manuscript
    source_reference: manuscript://upload/source-digest-001
    ingestion_tier: tier_0_rules
    engine: none
    rung_before: null
    rung_after: null
    human_edited_after: false
    expected_result: valid-provenance-source
    visibility: steward-and-maintainer
    required_evidence:
      - original-digest
      - immutable-source-reference
      - captured-time
      - derived-output-links
    unresolved:
      - retention-period

  - id: capsule-from-issue
    kind: capsule
    artifact_kind: capsule
    source_reference: github:issue:42
    ingestion_tier: tier_1_actions_phi4
    engine: PME
    rung_before: R1
    rung_after: R2
    human_edited_after: true
    expected_result: valid-provenance-with-human-edit
    visibility: steward-default-contributor-own-record
    required_evidence:
      - issue-number-and-labels
      - ingestion-run-reference
      - engine-and-rung
      - human-editor-reference
    pilot_decision:
      reader_side_car_opt_in: not-enabled-for-private-pilot
      safe_reader_fields_when_enabled:
        - editorial-outcome-plain-language
        - ingestion-tier-plain-language
        - human-edited-after-when-true
        - acceptance-date-approximate
      permanently_private:
        - model-name-and-provider
        - engine-and-rung-details
        - ingestion-run-reference
        - contributor-or-steward-identity-beyond-approved-display

  - id: proposed-transformation
    kind: transformation
    artifact_kind: scene-draft
    proposal_lineage_ref: lineage-scene-001
    version_ref: proposal-version-001
    predecessor_version_ref: null
    fidelity_note_ref: fidelity-note-proposal-version-001
    review_event_refs: []
    source_reference: github:commit:source-sha-001
    output_reference: github:commit:output-sha-001
    ingestion_tier: tier_2_byo_ai
    engine: PIE
    rung_before: R4
    rung_after: R4
    human_edited_after: false
    fidelity_note:
      changed_material:
        - sentence structure
        - reading register
      preserved_intent:
        - plot claim
        - named entities
      ambiguities_flagged:
        - pronoun-reference-in-source
      semantic_preservation: uncertain
      structural_simplification: described
      audience_calibration: feedback-only
      human_review_status: not-reviewed
    contributor-facing-fixture:
      allowed_fields:
        - source-version-label
        - output-version-label
        - change-type
        - changed-material
        - preserved-intent
        - questions-to-check
        - meaning-check
        - structure-and-length
        - intended-audience
        - review-status-and-safe-event
      protected_field_categories:
        - model-provider-and-operational-metadata
        - github-and-repository-references
        - machine-scores-and-comparison-material
        - identity-and-private-annotations
        - consent-and-attribution-controls
        - moderation-and-safety-records
        - legal-retention-and-deletion-records
        - unreleased-source-and-output-material
      protected_sentinels:
        model_provider: private-model-provider-sentinel
        engine_and_run: "PIE / run-private-001"
        github_repository: "github:OKHP3/telling-forward"
        github_commit: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
        source_digest: "sha256:private-source-digest"
        machine_score: 0.97
        machine_diff: machine-diff-sentinel
        contributor_identity: github:other-contributor
        steward_identity: github:private-steward
        private_annotation: private-reviewer-annotation
        consent_record: consent-record-private-001
        moderation_record: moderation-case-private-001
        safety_evidence: private-safety-evidence
        legal_hold: legal-hold-private-001
        retention_decision: retain-until-private-date
        deletion_decision: deletion-approval-private-001
        appeal_evidence: private-appeal-evidence
        unreleased_material: unreleased-private-material
    expected_result: proposed-output-not-authorized
    visibility: contributor-and-steward
    unresolved:
      - transform-specific-consent
      - source-specific-derivative-rule

  - id: contributor-requested-revision
    kind: review-revision
    artifact_kind: scene-draft
    proposal_lineage_ref: lineage-scene-001
    reviewed_version:
      version_ref: proposal-version-001
      fidelity_note_ref: fidelity-note-proposal-version-001
      review_event:
        event_ref: review-event-request-changes-001
        action: request-revision
        resulting_review_state: changes-requested
        safe_reason: "Please check the scene's sequence and one unclear reference."
    revised_version:
      version_ref: proposal-version-002
      predecessor_version_ref: proposal-version-001
      fidelity_note_ref: fidelity-note-proposal-version-002
      review_event_refs: []
      predecessor_fidelity_note_retained_ref: fidelity-note-proposal-version-001
      predecessor_review_event_retained_ref: review-event-request-changes-001
    prior_version_and_note_retained: true
    expected_result: append-only-revision-with-lineage
    visibility: contributor-own-lineage-steward-full-lineage
    required_evidence:
      - proposal-lineage-reference
      - predecessor-version-reference
      - new-output-reference
      - new-fidelity-note-reference
      - immutable-prior-review-event
      - immutable-prior-fidelity-note
      - no-review-outcome-inherited-by-revised-version

  - id: contributor-accepted-version-is-frozen
    kind: review-outcome
    action: accept
    artifact_kind: scene-draft
    proposal_lineage_ref: lineage-scene-001
    reviewed_version_ref: proposal-version-002
    fidelity_note_ref: fidelity-note-proposal-version-002
    review_event:
      event_ref: review-event-accept-002
      resulting_review_state: accepted-by-contributor
    expected_result: accepted-version-and-event-append-only
    visibility: contributor-own-version-steward-full-lineage
    required_evidence:
      - exact-reviewed-version-reference
      - attached-fidelity-note
      - immutable-acceptance-event
      - no-canon-or-consent-claim

  - id: contributor-rejected-version-is-frozen
    kind: review-outcome
    action: reject
    artifact_kind: scene-draft
    proposal_lineage_ref: lineage-scene-001
    reviewed_version_ref: proposal-version-002
    fidelity_note_ref: fidelity-note-proposal-version-002
    review_event:
      event_ref: review-event-reject-002
      resulting_review_state: rejected-by-contributor
    later_attempt:
      version_ref: proposal-version-003
      predecessor_version_ref: proposal-version-002
      fidelity_note_ref: fidelity-note-proposal-version-003
    expected_result: rejected-version-retained-new-attempt-required
    visibility: contributor-own-version-steward-full-lineage
    required_evidence:
      - exact-reviewed-version-reference
      - immutable-rejection-event
      - rejected-fidelity-note-retained
      - later-attempt-has-new-version-and-note
      - no-consent-revocation-or-deletion-claim

  - id: steward-decision-appeal-retains-original
    kind: appeal
    artifact_kind: scene-draft
    proposal_lineage_ref: lineage-scene-001
    affected_version_ref: proposal-version-002
    steward_decision:
      decision_ref: steward-decision-002
      outcome: restricted
    review_event:
      event_ref: review-event-appeal-002
      action: appeal
      resulting_review_state: appeal-pending
    resolution:
      event_ref: review-event-appeal-resolution-002
      resulting_outcome: changes-requested
      successor_version_ref: proposal-version-003
    expected_result: appeal-appends-without-reopening-or-publishing
    visibility: contributor-safe-appeal-summary-steward-full-record
    required_evidence:
      - affected-version-reference
      - original-steward-decision-retained
      - appeal-request-retained
      - safe-contributor-reason
      - resolution-event-retained
      - successor-version-and-note-if-changes-allowed
      - no-auto-publish-or-consent-change

  - id: contributor-edit-after-transform
    kind: edit
    artifact_kind: scene-draft
    proposal_lineage_ref: lineage-scene-001
    version_ref: proposal-version-003
    predecessor_version_ref: proposal-version-002
    fidelity_note_ref: fidelity-note-human-edit-003
    source_reference: github:commit:output-sha-001
    output_reference: github:commit:human-edit-sha-001
    ingestion_tier: human
    engine: none
    rung_before: R4
    rung_after: R4
    human_edited_after: true
    expected_result: new-version-with-human-attribution
    visibility: contributor-and-steward
    required_evidence:
      - source-version
      - edited-version
      - human-editor-reference
      - edit-time
    unresolved:
      - whether-reader-sees-fidelity-history

  - id: accepted-canon-with-provenance
    kind: acceptance
    artifact_kind: scene
    source_reference: github:pr:42
    output_reference: github:commit:canon-sha-001
    ingestion_tier: tier_1_actions_phi4
    engine: none
    rung_before: R4
    rung_after: R4
    human_edited_after: true
    expected_result: accepted-into-canon
    visibility: reader-safe-summary-steward-full-record
    required_evidence:
      - source-path
      - contributor-attribution
      - steward-attribution
      - decision-time
      - canon-commit-sha
      - accepted-provenance-marker
    pilot_decision:
      public_process_narrative_opt_in: deferred-pending-working-laboratory-approval
      safe_reader_fields_when_enabled:
        - editorial-outcome-plain-language
        - ingestion-tier-plain-language
        - human-edited-after-when-true
        - acceptance-date-approximate
      permanently_private:
        - pr-number-and-commit-sha
        - steward-identity
        - contributor-identity-beyond-approved-display
        - fidelity-note-content

  - id: alternate-path-with-provenance
    kind: alternate
    artifact_kind: scene
    source_reference: github:pr:43
    output_reference: github:branch:contrib-alternate
    ingestion_tier: human
    engine: none
    rung_before: null
    rung_after: null
    human_edited_after: true
    expected_result: published-alternate
    visibility: steward-default-reader-only-after-public-edition
    required_evidence:
      - source-path
      - contributor-attribution
      - review-outcome
      - alternate-path-reference
    pilot_decision:
      reader_release_approval: not-approved-for-private-pilot-requires-public-edition-gate
      read_follow_signal: steward-only-if-built
      safe_reader_fields_when_enabled:
        - editorial-outcome-plain-language
        - acceptance-date-approximate
      permanently_private:
        - pr-number-and-branch-reference
        - contributor-identity-beyond-approved-display

  - id: missing-provenance-source
    kind: missing-provenance
    artifact_kind: scene
    source_reference: null
    ingestion_tier: tier_2_byo_ai
    engine: CIE
    rung_before: R5
    rung_after: R6
    human_edited_after: false
    expected_result: incomplete-and-not-fully-proven
    visibility: steward-only-hold
    required_evidence:
      - missing-source-condition
      - unresolved-identity-or-run-reference
      - no-acceptance-claim
    unresolved:
      - whether-recovery-is-possible
      - rights-and-consent-review
