  - id: under-review-contributor-withdraws
    situation: A contributor withdraws while a steward is reviewing the submission.
    current_proposal_state: under-review
    requested_outcome: withdrawn-and-preserved
    requester: verified-proposal-contributor
    approval: existing-eligible-withdrawal-authorization-and-steward-notice
    reader_visibility: no-active-review-or-ordinary-reader-display
    can_reenter_same_proposal: false
    recoverable:
