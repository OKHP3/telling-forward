    unresolved:
      - public-redaction-versus-required-provenance
      - downstream-quotes-and-derivative-material
      - jurisdictional-and-retention-rules

  - id: steward-restricts-for-safety
    situation: A steward restricts an under-review submission after a safety concern.
    current_proposal_state: under-review
