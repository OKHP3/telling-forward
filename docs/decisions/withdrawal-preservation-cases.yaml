schema: telling-forward.withdrawal-preservation-cases.v1
status: policy-fixtures-only
enforcement_approved: false
proposal_state_model_unchanged: true
public_contribution_launched: false
cases:
  - id: draft-contributor-withdraws
    situation: A contributor withdraws a draft before editorial review begins.
    current_proposal_state: draft
    requested_outcome: withdrawn-and-preserved
    requester: verified-proposal-contributor
    approval: existing-eligible-withdrawal-authorization
    reader_visibility: not-presented-as-active-or-available
    can_reenter_same_proposal: false
    recoverable:
