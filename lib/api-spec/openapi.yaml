openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and account management
  - name: storyworlds
    description: Storyworlds and their story paths
  - name: proposals
    description: Proposals (pull-request-backed submissions)
  - name: narrate
    description: Voice narration and transcription for mobile contributors
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new contributor account
      description: Registers with email and password. No GitHub account required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Return the current user's profile
      description: Requires an active session.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/github/authorize:
    get:
      operationId: githubAuthorize
      tags: [auth]
      summary: Start GitHub account linking
      description: >
        Redirects to GitHub's OAuth authorization page. The user must already
        be logged in. GitHub account linking is optional — contributors do not
        need a GitHub account to participate.
      responses:
        "302":
          description: Redirect to GitHub
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: GitHub linking not configured on this server

  /auth/github/callback:
    get:
      operationId: githubCallback
      tags: [auth]
      summary: GitHub OAuth callback
      description: >
        GitHub redirects here after the user authorizes the app. Links the
        GitHub account to the current platform account and redirects to the
        frontend.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend with github_link query param (success|denied|error)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /storyworlds:
    get:
      operationId: listStoryworlds
      tags: [storyworlds]
      summary: List all storyworlds
      responses:
        "200":
          description: Storyworld list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Storyworld"

  /storyworlds/{id}:
    get:
      operationId: getStoryworld
      tags: [storyworlds]
      summary: Get a storyworld by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Storyworld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storyworld"
        "404":
          $ref: "#/components/responses/NotFound"

  /storyworlds/{id}/paths:
    get:
      operationId: listStoryPaths
      tags: [storyworlds]
      summary: List story paths for a storyworld
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Story path list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryPath"
        "404":
          $ref: "#/components/responses/NotFound"

  /storyworlds/{id}/paths/{pathId}/contributions:
    get:
      operationId: listContributions
      tags: [storyworlds]
      summary: List contributions for a story path
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pathId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contribution list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contribution"
        "404":
          $ref: "#/components/responses/NotFound"

  /storyworlds/{id}/proposals:
    get:
      operationId: listStoryworldProposals
      tags: [proposals]
      summary: List all proposals for a storyworld (steward dashboard)
      description: >
        Returns proposals for a storyworld ordered by submission date descending.
        Requires authentication and steward role for the storyworld.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a steward for this storyworld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: List proposals
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"

  /transcribe:
    post:
      operationId: transcribeAudio
      tags: [narrate]
      summary: Transcribe voice narration to text
      description: >
        Accepts a base64-encoded audio recording and returns the transcribed
        text. Uses OpenAI Whisper when OPENAI_API_KEY is configured on the
        server. Returns 503 when not configured — clients should fall back to
        manual text entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: Transcribed text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "503":
          description: Transcription service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /proposals/{id}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: Get a proposal by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          $ref: "#/components/responses/NotFound"

  /proposals/{id}/review:
    post:
      operationId: markProposalUnderReview
      tags: [proposals]
      summary: Mark a submission as under steward review
      description: >
        Transitions a submitted proposal to the "under-review" state, signalling
        to the contributor that a steward has begun reading it.
        Requires authentication and steward role for the proposal's storyworld.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a steward for this storyworld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Proposal is not in a state that allows this transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /proposals/{id}/accept:
    post:
      operationId: acceptProposal
      tags: [proposals]
      summary: Accept a submission into canon
      description: >
        Merges the backing pull request into the canon branch via Octokit,
        transitions state to "accepted-into-canon", and writes a provenance
        record. Requires authentication and steward role for the storyworld.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted proposal with provenance record id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptProposalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a steward for this storyworld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Proposal cannot be accepted in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: GitHub merge failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /proposals/{id}/return:
    post:
      operationId: returnProposal
      tags: [proposals]
      summary: Return a submission with an editor question
      description: >
        Posts a review comment on the backing pull request explaining what needs
        to change, transitions state to "returned-with-notes", and creates an
        editor_question row. Requires authentication and steward role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnProposalBody"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a steward for this storyworld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Proposal cannot be returned in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: GitHub review comment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          minLength: 1
      required:
        - email
        - password
        - displayName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    PublicUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - displayName
        - createdAt

    GithubLinkInfo:
      type: object
      properties:
        githubUsername:
          type: string
        githubEmail:
          type: string
          nullable: true
        linkedAt:
          type: string
          format: date-time
      required:
        - githubUsername
        - linkedAt

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - user

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        github:
          oneOf:
            - $ref: "#/components/schemas/GithubLinkInfo"
            - type: "null"
      required:
        - user
        - github

    Storyworld:
      type: object
      properties:
        id:
          type: integer
        repoOwner:
          type: string
        repoName:
          type: string
        title:
          type: string
        stewardId:
          type: integer
          nullable: true
        canonBranchRef:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - repoOwner
        - repoName
        - title
        - canonBranchRef
        - createdAt
        - updatedAt

    StoryPath:
      type: object
      properties:
        id:
          type: integer
        storyworldId:
          type: integer
        branchRef:
          type: string
        title:
          type: string
        originPathId:
          type: integer
          nullable: true
        state:
          type: string
          enum: [personal, open, proposed, published-alternate]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - storyworldId
        - branchRef
        - title
        - state
        - createdAt
        - updatedAt

    Contribution:
      type: object
      properties:
        id:
          type: integer
        storyworldId:
          type: integer
        pathId:
          type: integer
        commitSha:
          type: string
        contributorId:
          type: integer
          nullable: true
        title:
          type: string
        summary:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - storyworldId
        - pathId
        - commitSha
        - title
        - createdAt

    TranscribeRequest:
      type: object
      properties:
        audioBase64:
          type: string
          description: Base64-encoded audio data
        mimeType:
          type: string
          description: "MIME type of the audio (e.g. audio/m4a, audio/webm)"
      required: [audioBase64, mimeType]

    TranscribeResponse:
      type: object
      properties:
        text:
          type: string
          description: Transcribed text from the audio
      required: [text]

    ReturnProposalBody:
      type: object
      properties:
        editorQuestion:
          type: string
          minLength: 1
          description: >
            The question or guidance returned to the contributor. Surfaces as an
            editor question on the proposal view; posted as a PR review comment
            on GitHub.
      required:
        - editorQuestion

    AcceptProposalResponse:
      type: object
      properties:
        proposal:
          $ref: "#/components/schemas/Proposal"
        provenanceRecordId:
          type: integer
          description: ID of the provenance_records row created on acceptance.
      required:
        - proposal
        - provenanceRecordId

    Proposal:
      type: object
      properties:
        id:
          type: integer
        storyworldId:
          type: integer
        pathId:
          type: integer
        prNumber:
          type: integer
        state:
          type: string
          enum:
            - draft
            - submitted
            - under-review
            - returned-with-notes
            - accepted-into-canon
            - published-alternate
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - storyworldId
        - pathId
        - prNumber
        - state
        - submittedAt

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Missing or invalid fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
