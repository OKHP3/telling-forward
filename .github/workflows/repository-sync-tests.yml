name: Repository sync safety

on:
  push:
    branches: [main]
    paths: ['scripts/*git*.sh', 'scripts/*hooks*.sh', '.github/scripts/pending_mermaid_refresh.py', '.github/scripts/tests/**', '.github/workflows/repository-sync-tests.yml']
  pull_request:
    paths: ['scripts/*git*.sh', 'scripts/*hooks*.sh', '.github/scripts/pending_mermaid_refresh.py', '.github/scripts/tests/**', '.github/workflows/repository-sync-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/test-sync-github.sh
      - run: bash scripts/test-hooks-smoke.sh
      - run: python3 -B -m unittest discover -s .github/scripts/tests -v
